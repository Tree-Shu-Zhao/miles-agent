[project]
name = "wiki-search-server"
version = "0.0.1"
# Lower bound covers both the server venvs (CPython 3.13.14) and container py3.12 stacks.
requires-python = ">= 3.12"
dependencies = [
    "nemo-gym[dev]",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["wiki_search"]

# 3 levels up = repo root; Gym is the pinned submodule there.
[tool.uv.sources]
nemo-gym = { path = "../../../3rdparty/Gym", editable = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]