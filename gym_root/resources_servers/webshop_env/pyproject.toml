[project]
name = "webshop-env-server"
version = "0.0.1"
# nemo-gym's own pin; the adapter is a THIN py3.13 proxy over the py3.10
# WebShop engine server, so it carries NO engine deps (no pyserini/spacy/gym —
# those live in the micromamba engine env, env_servers/webshop/).
requires-python = ">= 3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "httpx",
    # Shared session-Gymnasium base (gym_root/agent_utils/session_gym.py).
    "miles-agent-utils",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "setuptools-scm"]

# Package name is webshop_env, NOT webshop: the server package must not shadow
# anything in the engine venv (they are separate processes anyway).
[tool.setuptools.packages.find]
where = [".."]
include = ["webshop_env"]

# 3 levels up = repo root; Gym is the pinned submodule there. agent_utils is
# the sibling overlay package (the venv builder installs it editable too, see
# scripts/build_gym_venvs.sh; tests import it via conftest).
[tool.uv.sources]
nemo-gym = { path = "../../../3rdparty/Gym", editable = true}
miles-agent-utils = { path = "../../agent_utils", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
