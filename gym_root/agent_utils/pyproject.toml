[project]
name = "miles-agent-utils"
version = "0.0.1"
# Lower bound covers both the server venvs (CPython 3.13.14) and container py3.12 stacks.
requires-python = ">= 3.12"
dependencies = [
    "nemo-gym",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["agent_utils"]

# 2 levels up = repo root; Gym is the pinned submodule there. Consumers install
# nemo-gym editable first (their requirements.txt / venv stanza), so this
# source is only exercised by direct `uv sync` on this project.
[tool.uv.sources]
nemo-gym = { path = "../../3rdparty/Gym", editable = true}
