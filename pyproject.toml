[project]
name = "miles-agent"
version = "0.1.0"
description = "Overlay wiring the miles RL trainer to NeMo Gym environments and Harbor trials, without modifying either"
license = "Apache-2.0"
requires-python = ">=3.13.14"
dependencies = []

[tool.uv]
# Virtual project: this repo ships no importable package. gym servers carry
# their own per-server venvs; recipe modules ride PYTHONPATH into the trainer
# container. The root venv exists only for tests and data prep.
package = false

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "jinja2>=3.1",  # the fixed chat templates in tests/conftest.py
]
# dev-only: schema contract tests validate against the real gym pydantic models
gym = ["nemo-gym"]

[tool.uv.sources]
nemo-gym = { path = "3rdparty/Gym", editable = true }

[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = ["3rdparty"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
